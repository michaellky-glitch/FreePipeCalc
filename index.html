<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FreePipeCalc — Piping Friction Loss Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="brand" title="FreePipeCalc">FPC <span class="ver" id="app-version"></span></div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-pane="pane-network" aria-selected="true">PIPING NETWORK</button>
    <button class="tab" role="tab" data-pane="pane-calculation" aria-selected="false">CALCULATION</button>
    <button class="tab" role="tab" data-pane="pane-hydraulic" aria-selected="false">HYDRAULIC</button>
    <button class="tab" role="tab" data-pane="pane-tools" aria-selected="false">TOOLS</button>
    <button class="tab" role="tab" data-pane="pane-settings" aria-selected="false">SETTINGS</button>
    <button class="tab" role="tab" data-pane="pane-docs" aria-selected="false">DOCUMENTATION</button>
  </nav>
  <div class="spacer"></div>
  <span class="chip" id="status-chip">starting…</span>
</div>

<!-- ==================================================== PIPING NETWORK -->
<section class="pane pane-flush" id="pane-network" data-active="true" role="tabpanel">
  <div class="toolbar">
    <!-- Grouped by what the button DOES, not by when it was added:
         file actions, then the mode you are in, then the thing you draw. -->
    <div class="tool-group" data-group="FILE">
      <button class="btn" id="btn-new">NEW</button>
      <button class="btn" id="btn-save">SAVE</button>
      <button class="btn" id="btn-load">LOAD</button>
      <button class="btn" id="btn-print">PRINT</button>
      <button class="btn icon" id="btn-undo" title="Undo (Ctrl+Z)">↶</button>
      <button class="btn icon" id="btn-redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="sep"></div>
    <div class="tool-group" data-group="MODES">
      <button class="btn" data-tool="edit">EDIT</button>
      <button class="btn" data-tool="layout">LAYOUT</button>
      <button class="btn" data-tool="trace">TRACE</button>
      <button class="btn" data-tool="disconnect" title="Highlight breaks: coincident unjoined nodes, islands, and devices with nowhere to discharge">SHOW DISCONNECT</button>
    </div>
    <div class="sep"></div>
    <div class="tool-group" data-group="DRAW">
      <button class="btn" data-tool="pipe">PIPE</button>
      <button class="btn" data-tool="riser">RISER</button>
      <button class="btn" data-tool="source">SOURCE</button>
      <button class="btn" data-tool="demand">OUTFLOW</button>
      <button class="btn" data-tool="pump">PUMP</button>
      <button class="btn" data-tool="equip">EQUIP</button>
      <button class="btn" data-tool="valve" id="btn-valve">VALVE</button>
      <select id="valve-type" class="inline-select" title="Valve type to place">
        <option value="gate">Gate</option>
        <option value="check">Check</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="tool-group" data-group="MISC">
      <button class="btn" id="btn-renumber" title="Renumber nodes in flow order">RENUMBER</button>
      <button class="btn icon" id="btn-fit" title="Zoom to fit">⤢</button>
    </div>
    <div class="spacer"></div>
    <span class="chip mode-chip" id="mode-chip" title="">DESIGN</span>
    <span class="chip system-chip" id="system-chip" title="">NO SUPPLY</span>
    <span class="hint-inline" id="mode-hint"></span>
  </div>

  <div class="netlayout">
    <!-- Both panels sit on the left so the eye and the mouse stay on one side
         of the screen while drawing (user request). -->
    <aside class="panel panel-left">
      <div class="panel-head">
        <span>LEVELS</span>
        <span>
          <button class="btn tiny" id="btn-add-level" title="Add level above">+</button>
          <button class="btn tiny" id="btn-del-level" title="Remove active level">−</button>
        </span>
      </div>
      <div id="level-list"></div>

      <div class="panel-head panel-head-2"><span>PROPERTIES</span></div>
      <div id="prop-body"></div>
    </aside>

    <div class="canvas-host">
      <canvas id="canvas"></canvas>
    </div>
  </div>
</section>

<!-- ====================================================== CALCULATION -->
<section class="pane" id="pane-calculation" role="tabpanel">
  <div class="wrap">
    <div class="calc-actions">
      <button class="btn" id="btn-csv">SAVE CALCULATION (CSV)</button>
      <button class="btn" id="btn-save-2">SAVE MODEL</button>
      <button class="btn" id="btn-print-2">PRINT</button>
    </div>
    <div id="calc-body"></div>
  </div>
</section>

<!-- ======================================================== HYDRAULIC -->
<section class="pane" id="pane-hydraulic" role="tabpanel">
  <div class="wrap">
    <div id="hydraulic-body"></div>
  </div>
</section>

<!-- ============================================================ TOOLS -->
<section class="pane" id="pane-tools" role="tabpanel">
  <div class="wrap">
    <div id="tools-body"></div>
  </div>
</section>

<!-- ========================================================= SETTINGS -->
<section class="pane" id="pane-settings" role="tabpanel">
  <div class="wrap">
    <div id="settings-body"></div>
    <p class="footer-note">
      FreePipeCalc is free software under the MIT licence — see LICENSE.txt.<br>
      For preliminary design assistance only. Results must be verified by a qualified engineer.
      No warranty; no liability.
    </p>
  </div>
</section>

<!-- ==================================================== DOCUMENTATION -->
<section class="pane" id="pane-docs" role="tabpanel">
  <div class="doc-layout">
    <nav class="doc-nav" id="doc-nav"></nav>
    <div class="doc-content" id="doc-content"></div>
  </div>
</section>

<input type="file" id="file-input" accept=".json,.pnet.json,application/json" hidden>
<div id="toasts"></div>

<!-- Printed level plans are built here on demand; hidden on screen. -->
<div id="print-plans" aria-hidden="true"></div>

<!-- =====================================================================
     Load order matters and is deliberate. These are CLASSIC scripts, not
     ES modules: browsers block module loading over file:// (CORS treats a
     file origin as opaque), which would break the "open it by double-
     clicking, no build step" requirement in spec §1. Every file attaches
     to the single global FD namespace. See docs/ENGINE.md §1.
     ================================================================== -->
<!-- The ?v= query is a cache-buster. It is NOT a build step and NOT a fetch:
     these are still ordinary classic <script src> tags, so the file:// rule
     (no ES modules, no fetch of siblings — §2.1) is untouched. Browsers ignore
     the query when resolving a file:// path, so double-clicking still works;
     over HTTP, changing the token forces a reload instead of a stale copy.
     Bump the token on release, or during development after editing a module. -->
<script src="data/schedules.js?v=0.6.0-dev"></script>
<script src="data/fittings.js?v=0.6.0-dev"></script>
<script src="data/valves.js?v=0.6.0-dev"></script>
<script src="data/ktable.js?v=0.6.0-dev"></script>
<script src="data/pumps.js?v=0.6.0-dev"></script>
<script src="src/units.js?v=0.6.0-dev"></script>
<script src="src/hydraulics.js?v=0.6.0-dev"></script>
<script src="src/solver.js?v=0.6.0-dev"></script>
<script src="src/model.js?v=0.6.0-dev"></script>
<script src="src/geometry.js?v=0.6.0-dev"></script>
<script src="src/network.js?v=0.6.0-dev"></script>
<script src="src/dialog.js?v=0.6.0-dev"></script>
<script src="src/trace.js?v=0.6.0-dev"></script>
<script src="src/canvas.js?v=0.6.0-dev"></script>
<script src="src/printer.js?v=0.6.0-dev"></script>
<script src="src/tools.js?v=0.6.0-dev"></script>
<script src="src/docs.js?v=0.6.0-dev"></script>
<script src="src/app.js?v=0.6.0-dev"></script>
<script>
  window.FD.APP_NAME = 'FreePipeCalc';
  window.FD.APP_SHORT = 'FPC';
  window.FD.VERSION = '0.6.0-dev';
  window.FD.FORMAT_VERSION = 1;
  try {
    window.FD.initApp();
  } catch (err) {
    var chip = document.getElementById('status-chip');
    chip.textContent = 'Startup error — see console';
    chip.className = 'chip error';
    console.error(err);
  }
</script>
</body>
</html>
